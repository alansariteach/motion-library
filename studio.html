<style>/* Layout: "Gulf Sand" identity. Header with logo mark, socials and language switch; a teal hero card holding the recoloured logo;
   how-to + download; then a two-column bin: a sticky category sidebar (a drawer on phones) and a grid of motion clips. */
:root{
  --bg:#EFE6D8; --panel:#FBF7F0; --panel2:#F3EBDD; --line:#DCCDB6;
  --fg:#1F2A2E; --muted:#625B4F; --acc:#0F5B66; --acc-ink:#F6EFE2; --acc2:#E3643F; --acc2-ink:#2A1007; --ok:#0F7A55;
  --hero:#0F5B66; --hero-fg:#F6EFE2; --hero-dim:#CFE0DC; --hero-acc:#F3B79E;
  /* preview monitors: deep sea in both themes */
  --mon:#102E33; --mon2:#17393F; --mon-fg:#F6EFE2; --mon-dim:rgba(246,239,226,.55); --coral:#F07A50; --mint:#7FE0C8; --ink-on:#2A1007;
  --f-ar:"Alexandria",system-ui,sans-serif; --f-mono:"Space Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1B1D; --panel:#152629; --panel2:#1B2F33; --line:#27403F;
  --fg:#EFE6D8; --muted:#A99F8E; --acc:#5FB8C2; --acc-ink:#0B1A1C; --acc2:#F07A50; --acc2-ink:#2A1007; --ok:#7FE0C8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1B1D; --panel:#152629; --panel2:#1B2F33; --line:#27403F;
  --fg:#EFE6D8; --muted:#A99F8E; --acc:#5FB8C2; --acc-ink:#0B1A1C; --acc2:#F07A50; --acc2-ink:#2A1007; --ok:#7FE0C8; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:var(--f-ar);font-size:16px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;display:flex;flex-direction:column;gap:26px}
.mono{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
button{font-family:var(--f-ar);cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand img{width:52px;height:52px;object-fit:contain;padding:4px;border-radius:12px;background:var(--hero)}
.brand b{font-family:"Orbitron",var(--f-mono);font-weight:800;font-size:20px;letter-spacing:.12em;direction:ltr}
.brand b span{color:var(--acc2)}
.brand img{transform:rotate(-4deg);box-shadow:4px 4px 0 var(--acc2)}
@media (max-width:560px){.brand b{display:none}.brand img{width:44px;height:44px}}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.soc{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 14px 0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);text-decoration:none;font-family:var(--f-mono);font-size:13px}
.soc{direction:ltr;unicode-bidi:isolate}
.soc svg{width:20px;height:20px;flex:0 0 auto}
.soc.ig svg{color:#C2456F}
.soc.tg svg{color:#2A9BD6}
.soc.ml svg{color:var(--acc2)}
.madeby a{color:inherit;text-decoration:none;font-weight:700}
.hcta{display:inline-flex;align-items:center;height:42px;padding:0 20px;border-radius:999px;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:600;font-size:15px}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel);height:42px}
.lang button{border:0;background:transparent;padding:0 14px;font-weight:700;font-size:14px}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
/* hero */
.hero{position:relative;background:var(--hero);color:var(--hero-fg);border-radius:28px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center;overflow:hidden}
.hero::before{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:var(--acc2);opacity:.95}
.hero > *{position:relative;z-index:1}
.hero .txt{padding:56px 44px 40px;display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:13px;letter-spacing:.12em;color:var(--hero-acc)}
.hero h1{margin:0;font-family:"Changa",var(--f-ar);font-weight:800;font-size:clamp(44px,6.4vw,84px);line-height:1.05;text-wrap:balance}
.hero p{margin:0;color:var(--hero-dim);font-size:18px;line-height:1.8;max-width:50ch;font-weight:300}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.stats div{background:rgba(255,255,255,.1);border-radius:16px;padding:10px 16px;display:flex;flex-direction:column}
.stats b{font-family:var(--f-mono);font-size:22px;direction:ltr}
.stats span{font-size:13px;color:var(--hero-dim)}
.hero .logo-big{display:block;width:100%;height:auto;max-width:100%;padding:28px 28px 28px 8px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.25))}
/* how + download */
.vidbox{margin-top:16px}.vidbox video{width:100%;height:auto;aspect-ratio:16/9;border-radius:16px;background:#000;display:block}
.top2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box h2{margin:0;font-size:19px;font-weight:800}
.how{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.how li{display:grid;grid-template-columns:auto 1fr;gap:12px;counter-increment:s;font-size:15.5px}
.how li::before{content:counter(s);font-family:var(--f-mono);font-size:13px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);font-weight:700;margin-top:1px}
code{font-family:var(--f-mono);font-size:13px;background:var(--panel2);padding:1px 7px;border-radius:7px;direction:ltr;unicode-bidi:isolate}
.ex{background:var(--panel2);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.85}
.box p{margin:0;font-size:15px;color:var(--muted)}
.fintro{color:var(--fg)!important}
.fsteps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:f}
.fsteps li{position:relative;display:block;padding-inline-start:38px;counter-increment:f;font-size:15px;line-height:1.75}
.fsteps li::before{content:counter(f);position:absolute;inset-inline-start:0;top:0;font-family:var(--f-mono);font-size:12.5px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--acc2);color:var(--acc2-ink);font-weight:700}
.fex{display:block;margin-top:6px;background:var(--panel2);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--fg)}
.fnote{font-size:13.5px!important}
.dl{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:700;font-size:15px;background:var(--acc);color:var(--acc-ink);display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn small{font-family:var(--f-mono);font-size:12px;opacity:.8}
/* bin: sidebar + grid */
.bin{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 24px);overflow:auto}
.side h3{margin:4px 8px 6px;font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:600}
#q{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:9px 14px;font-family:var(--f-ar);font-size:15px;margin-bottom:6px}
.cat{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:transparent;border-radius:14px;padding:10px 12px;font-weight:600;font-size:15.5px;text-align:start;width:100%;min-height:44px}
.cat:hover{background:var(--panel2)}
.cat .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:28px;text-align:center;border-radius:999px;padding:1px 6px;background:var(--panel2)}
.cat .ic{width:10px;height:10px;border-radius:50%;background:var(--line);flex:0 0 auto}
.cat .lbl2{display:flex;align-items:center;gap:10px}
.cat[aria-pressed="true"]{background:var(--acc2);color:var(--acc2-ink)}
.cat[aria-pressed="true"] .n{background:rgba(42,16,7,.14);color:var(--acc2-ink)}
.cat[aria-pressed="true"] .ic{background:var(--acc2-ink)}
.side .soon{margin:8px 8px 2px;font-size:13px;color:var(--muted)}
.bar{display:none}
.mainh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 4px 14px}
.mainh h2{margin:0;font-size:24px;font-weight:800}
.mainh span{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:9px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .st{border-radius:15px}
.meta{padding:0 5px 5px;display:flex;flex-direction:column;gap:2px;min-width:0}
.idrow{display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);direction:ltr;white-space:nowrap;min-width:0}
.idrow .lp{overflow:hidden;text-overflow:ellipsis;min-width:0}
.idrow b{color:var(--acc);font-weight:700}
.en{font-family:var(--f-mono);font-weight:700;font-size:14.5px;direction:ltr;text-align:start;line-height:1.35}
html[dir="rtl"] .en{text-align:right}
.ar{font-weight:700;font-size:15.5px;line-height:1.45}
.use{font-size:13px;color:var(--muted);line-height:1.6}
.need{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.nchip{font-size:11.5px;line-height:1.4;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--fg);background:var(--bg);font-weight:600}
.nchip.nf{border-color:var(--acc2);color:var(--acc2)}
.nchip.nt{border-color:var(--acc);color:var(--acc)}
.nchip.n0{color:var(--muted);font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.acts button.exb{order:3;flex:1 1 100%;background:transparent;border-color:var(--acc2);color:var(--acc2)}
.exm{position:fixed;inset:0;z-index:90;background:rgba(8,20,22,.82);display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.exm[hidden]{display:none!important}
.exbox{position:relative;width:min(92vw,calc((100dvh - 170px)*9/16));display:flex;flex-direction:column;gap:10px}
.exbox video{width:100%;aspect-ratio:9/16;object-fit:contain;background:#000;border-radius:18px;display:block}
.exx{align-self:flex-end;min-width:44px;min-height:44px;border-radius:999px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font-size:18px}
.exc{color:#FBF7F0;font-size:13.5px;line-height:1.6;text-align:center;min-height:22px}
.acts button{flex:1;white-space:nowrap;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 4px;font-weight:600;font-size:12.5px;min-height:38px}
.acts button+button{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.acts button.done{border-color:var(--ok);color:var(--ok);background:transparent}
.empty{color:var(--muted);text-align:center;padding:40px 0}
footer{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);font-size:13px;padding-top:10px}
footer .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* fonts view */
.tabs{display:flex;gap:8px;margin:2px 0 14px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:10px 22px;font-weight:800;font-size:16px;min-height:46px;display:inline-flex;gap:8px;align-items:center}
.tabs button small{font-family:var(--f-mono);font-size:12px;opacity:.7;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#fontsView[hidden]{display:none}
#fontsView{display:flex;flex-direction:column;gap:18px}
.fctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fctl input{flex:1 1 220px;min-width:0;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:10px 16px;font-family:var(--f-ar);font-size:15px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{border:1.5px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;min-height:38px}
.fchips button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.fsec h2{margin:6px 4px 12px;font-size:22px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fsec h2 span{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.fnt{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.fnt[hidden]{display:none}
.fnt .fid{font-family:var(--f-mono);font-size:12px;color:var(--acc);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.fnt .fid i{font-style:normal;color:var(--muted);font-weight:500}
.fprev{height:112px;border-radius:16px;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px;font-size:26px;line-height:1.35;overflow:hidden;word-break:break-word;color:var(--fg)}
.fnt h3{margin:0;font-size:16px;font-weight:800;font-family:var(--f-mono);direction:ltr;text-align:start}
.dl a.btn{text-decoration:none}
.live{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}.live p{font-size:14px!important}.plst{margin:0;padding-inline-start:20px;font-size:14px;color:var(--muted);line-height:1.8}#plCp{font-family:var(--f-mono);direction:ltr}
.fmeta{font-size:12.5px;color:var(--muted);direction:ltr;text-align:start}
.fnt .acts{margin-top:0}
.fnt .acts a{flex:1;text-align:center;text-decoration:none;color:var(--fg);border:1.5px solid var(--line);border-radius:999px;padding:6px 4px;font-weight:600;font-size:12.5px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
/* drawer for phones */
.scrim{position:fixed;inset:0;background:rgba(10,20,22,.45);z-index:40}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}.hero .txt{padding:28px 22px 6px}
  .top2{grid-template-columns:1fr}
  .bin{grid-template-columns:minmax(0,1fr)}
  .bar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;gap:10px;align-items:center}
  .bar .btn{flex:0 0 auto}
  .bar .cur{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(300px,84vw);max-height:none;border-radius:0;z-index:50;padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(105%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.25)}
  html[dir="ltr"] .side{transform:translateX(-105%)}
  html[dir="rtl"] .side{padding-right:max(14px,env(safe-area-inset-right,0px))}
  html[dir="ltr"] .side{padding-left:max(14px,env(safe-area-inset-left,0px))}
  .side.open,html[dir="ltr"] .side.open{transform:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .mainh h2{font-size:20px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

/* ---------- preview monitor ---------- */
.st{position:relative;aspect-ratio:4/5;background:var(--mon);border-radius:11px;overflow:hidden;container-type:inline-size;display:grid;place-items:center;color:var(--mon-fg);font-family:var(--f-ar);isolation:isolate}
.st .ph{position:absolute;inset:auto 0 0 0;height:3px;background:rgba(255,255,255,.12);z-index:9}
.st .ph::after{content:"";position:absolute;inset:0 0 0 auto;width:100%;background:var(--coral);transform-origin:right;animation:ph var(--d,2.8s) linear infinite}
@keyframes ph{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.st *{animation-duration:var(--d,2.8s);animation-iteration-count:infinite;animation-fill-mode:both}
.a{animation-name:var(--k);animation-timing-function:var(--ez,cubic-bezier(.2,.8,.2,1));animation-delay:calc(var(--i,0) * var(--sg,.12s) * var(--vf,1))}
.off .st *,.off .st *::before,.off .st *::after{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){
  .st *,.st *::before,.st *::after{animation-play-state:paused}
  .card:hover .st *,.card:hover .st *::before,.card:hover .st *::after,.card:focus-within .st *,.card:focus-within .st *::before,.card:focus-within .st *::after{animation-play-state:running}}
.T{font-weight:900;font-size:13cqw;line-height:1.15;text-align:center}
.Tm{font-family:var(--f-mono);font-weight:600;font-size:10cqw;direction:ltr}

{id:'M-005',c:'TXT',en:'Blur In',ar:'ظهور من ضبابية',use:'جمل هادئة أو بداية فيديو.',dur:'0.7s in · 0.5s out',ez:'easeOutQuad',

N(['M-122','CAM','Pan','حركة كاميرا أفقية','تحريك الكاميرا يمين ويسار على لقطة أو صورة.','Moves the frame left and right across a shot or photo.','2–4s','easeInOutSine',

N(['M-123','CAM','Tilt Up','حركة كاميرا عمودية','الكاميرا تطلع من تحت لفوق، مثل كشف شخص أو مبنى.','The frame moves bottom to top, like revealing a person or building.','2–4s','easeInOutSine',

N(['M-124','CAM','Rack Focus','تغيير الفوكس','الفوكس ينتقل من الشخص للخلفية أو العكس.','Focus shifts between the person and the background.','0.6s','easeInOutCubic',

N(['M-125','CAM','Whip Zoom','زوم خاطف','زوم سريع مع ضبابية حركة على الوجه.','A quick zoom with motion blur onto the face.','0.25s','easeOutExpo',

N(['M-126','CAM','Handheld Drift','حركة يد خفيفة','تخلي اللقطة الثابتة تبين كأنها مصورة باليد.','Makes a locked-off shot feel handheld.','loop · 4s','easeInOutSine',

N(['M-127','CAM','Dutch Tilt','ميلان الكاميرا','ميلان الكادر يعطي توتر أو غرابة.','Tilting the frame adds tension or unease.','0.5s','easeInOutCubic',

N(['M-129','CAM','Crash Zoom','زوم صادم','زوم قوي جداً على الوجه مع هزة، للمفاجأة.','A hard zoom onto the face with a shake, for surprise.','0.2s + 0.3s shake','easeOutExpo',

N(['M-130','CAM','Orbit','دوران حول الشخص','إحساس إن الكاميرا تدور حولك بخفة.','Feels like the camera is circling you slightly.','loop · 4s','easeInOutSine',

N(['M-131','CAM','Double Punch','زوم مرتين','قفزتين زوم ورا بعض للتأكيد القوي.','Two punch-ins in a row for strong emphasis.','2 cuts','cut',

N(['M-135','CAM','Freeze Frame','تجميد اللقطة','اللقطة توقف فجأة مع ألوان باهتة وتاق.','The shot freezes with muted color and a tag.','hold 1–2s','cut',

N(['M-136','CAM','Slow Motion','تبطيء الحركة','لحظة مهمة تتبطأ عشان المشاهد يشوفها.','An important moment slows down so viewers catch it.','ramp 0.2s','easeOutCubic',

N(['M-137','CAM','Speed Ramp','تسريع وتبطيء','الحركة تبطّي وبعدين تسرع فجأة، ستايل الأكشن.','Motion slows then speeds up suddenly, action style.','0.8s','custom curve',

N(['M-239','SCR','Form Fill','تعبئة نموذج','خانات تتعبى ورا بعض، للشروحات.','Form fields fill in one after another, for tutorials.','~0.8s per field','steps',
 'Each labelled field types its value in order (see M-082), and a checkmark appears at the end of each field when done.',
 'كل خانة لها عنوان تنكتب قيمتها بالترتيب (شوف M-082)، وتطلع علامة صح بآخر كل خانة لمن تخلص.',function(){return WIN('Sign up','<div class="dim2">Name</div><div class="kw a" style="--k:kclipL;--ez:steps(6)">Ali Alansari</div><div class="dim2">Handle</div><div class="ko a" style="--k:kclipL;--i:1;--sg:.4s;--ez:steps(8)">@alansari.tech</div>');},'3s']),
N(['M-240','SCR','Upload Progress','رفع ملف','ملف ينرفع مع شريط تقدم.','A file uploading with a progress bar.','1.2s','easeInOutCubic',

 'بطاقة ملف فيها أيقونة واسم، وشريط تقدم يتعبى من 0 لـ 100% والنسبة تعد، وبعدين تطلع علامة صح.',function(){return '<div class="col" style="gap:3cqw"><div class="kw mono" style="font-size:5.5cqw">reel_final.mp4</div><div class="pbar"><i class="a" style="--k:k193;--ez:ease-in-out"></i></div><div class="cnt" data-to="100" style="font-size:9cqw">0</div></div>';},'3s']),

N(['M-241','TRK','Label Follow','نص يلحق شي يتحرك','كلمة أو اسم يلحق شي يتحرك بالفيديو.','A label that sticks to a moving object.','live','tracked',
 'Track a point on the object (optical flow or a tracker) and attach a label with a small pointer above it; the label follows the point every frame with slight smoothing.',
 'تتبّع نقطة على الشي (optical flow أو أداة تتبع) وثبّت فوقها تاق مع سهم صغير، والتاق يلحق النقطة كل فريم بنعومة خفيفة.',function(){return BG()+'<i class="obj a" style="--k:ktrk"></i><div class="tlab a" style="--k:ktrk"><span>قهوتي</span></div>';},'3s']),
N(['M-242','TRK','Tracking Ring','دائرة تتبع','دائرة تلحق شي معين عشان تبينه.','A ring that follows an object to point it out.','live','tracked',
 'Track the object and draw a mint ring slightly larger than it, centered on the tracked point, with a soft pulse.',
 'تتبّع الشي وارسم حوله دائرة نعناعية أكبر منه شوي، مركزها على نقطة التتبع، مع نبض ناعم.',function(){return BG()+'<i class="obj a" style="--k:ktrk"></i><i class="tring a" style="--k:ktrk"></i>';},'3s']),
N(['M-243','TRK','Face Blur','تضبيب وجه','تخفي وجه شخص أو لوحة سيارة للخصوصية.','Hides a face or a plate for privacy.','live','tracked',
 'Detect and track the face (or plate) and cover it with a rounded box that blurs what is behind it about 2.5%, following it every frame.',
 'اكتشف الوجه (أو اللوحة) وتتبّعه، وغطّه بمربع بزوايا دائرية يضبّب اللي وراه تقريباً 2.5%، ويلحقه كل فريم.',function(){return BG()+P()+'<i class="pblur"></i>';}]),
N(['M-244','TRK','Callout Line','خط يأشر بملاحظة','خط ينرسم من شي لملاحظة جنبه.','A line draws from an object to a note beside it.','0.6s','easeInOutCubic',
 'A thin line draws from the tracked point to a corner over 0.6s, then a small note box fades in at the end of the line.',
 'خط رفيع ينرسم من النقطة المتتبعة لزاوية خلال 0.6 ثانية، وبعدين صندوق ملاحظة صغير يظهر بآخر الخط.',function(){return BG()+P()+'<svg class="call" style="position:absolute;inset:0;width:100%;height:100%;z-index:3" viewBox="0 0 100 125" aria-hidden="true"><path class="a" style="--k:kdraw;--ez:ease-in-out" pathLength="100" d="M50 40 L66 26 L84 26"/></svg><div class="cbx a" style="--k:kfade">نظارتي</div>';}]),
N(['M-245','TRK','Screen Replace','تبديل شاشة جوال','تحط صورة ثانية داخل شاشة جوال بالفيديو.','Puts another image inside a phone screen in the video.','live','tracked',
 'Track the four corners of the screen in the footage and warp your image or recording onto that quad every frame (corner pin), with a slight glare overlay.',
 'تتبّع الزوايا الأربع للشاشة في الفيديو، وركّب صورتك أو تسجيلك على هالشكل كل فريم (corner pin)، مع لمعة خفيفة فوقه.',function(){return BG()+'<i class="phn2 a" style="--k:ktrk"></i>';},'3s']),
N(['M-246','TRK','Arrow Follow','سهم يلحق','سهم يأشر على شي يتحرك.','An arrow that keeps pointing at a moving thing.','live','tracked',
 'Track the object and keep an accent arrow just above it pointing down, bobbing slightly while it follows.',
 'تتبّع الشي وخل سهم بلون الهوية فوقه على طول يأشر لتحت، ويتحرك شوي وهو يلحقه.',function(){return BG()+'<i class="obj a" style="--k:ktrk"></i><div class="a" style="--k:ktrk;position:absolute;left:43%;top:30%;width:14cqw;height:14cqw;color:var(--coral);z-index:4"><div style="transform:rotate(90deg)">'+SVGS.arrow+'</div></div>';},'3s']),
N(['M-247','TRK','Emoji Follow','إيموجي يلحق','إيموجي أو ملصق يلحق شي يتحرك.','A sticker or emoji that follows a moving object.','live','tracked',
 'Track the object and stick a sticker (or emoji image) on it, scaled to its size and following its position and rotation.',
 'تتبّع الشي والصق عليه ملصق (أو صورة إيموجي)، بحجمه، ويلحق مكانه ودورانه.',function(){return BG()+'<div class="a" style="--k:ktrk;position:absolute;left:41%;top:46%;width:18cqw;height:18cqw;border-radius:50%;background:#FFC857;display:grid;place-items:center;font-size:10cqw;z-index:4">★</div>';},'3s']),
N(['M-248','TRK','Path Trace','رسم مسار الحركة','خط يرسم الطريق اللي مشى فيه الشي.','Draws the path an object travelled.','live','linear',
 'Track the object and draw a dashed accent line along its past positions that builds up as it moves.',

N(['M-249','D3','3D Spin Text','نص يلف 3D','كلمة تلف حول نفسها ثلاثي الأبعاد.','A word spinning around its vertical axis in 3D.','loop · 3s','linear',
 'Rotate the text around the Y axis with perspective, one full turn every 3s; keep the back face visible or mirrored.',
 'لف النص على المحور العمودي مع عمق 3D، لفة كاملة كل 3 ثواني، وخل الوجه الخلفي ظاهر أو معكوس.',function(){return '<div class="p3"><div class="T Tm a" style="--k:k249;--ez:linear">3D</div></div>';},'3s']),
N(['M-250','D3','Extruded Text','نص بارز','نص سميك بارز مثل المجسم.','Thick extruded text like a solid object.','loop · 4s','easeInOutSine',
 'Give the text a stacked, darker accent depth (6–10 offset layers) and gently tilt it in 3D (±14°) on a 4s loop.',
 'خل للنص عمق متراكب بلون الهوية أغمق (6 إلى 10 طبقات منزاحة)، وميّله بخفة 3D (±14 درجة) كل 4 ثواني.',function(){return '<div class="T ext a" style="--k:k250;--ez:ease-in-out">بارز</div>';},'4s']),
N(['M-251','D3','Parallax 2.5D','صورة بعمق','صورة ثابتة تتحرك بطبقات كأن فيها عمق.','A still photo moves in layers as if it has depth.','loop · 4s','easeInOutSine',
 'Separate the subject from the background (matte or depth map); move the background slowly one way and the subject the other way, with a 115% scale to hide edges.',
 'افصل الشخص عن الخلفية (قناع أو خريطة عمق)، وحرّك الخلفية ببطء لجهة والشخص للجهة الثانية، مع تكبير 115% عشان الأطراف ما تبين.',function(){return '<div class="scene a" style="--k:k251b"><i class="lamp"></i></div><div class="a" style="--k:k251p;position:absolute;inset:0">'+P()+'</div>';},'4s']),
N(['M-252','D3','Card Flip','بطاقة تنقلب','بطاقة تنقلب وتكشف الجواب أو المعلومة.','A card flips to reveal the answer.','0.6s','easeInOutCubic',
 'A card rotates 180° around the Y axis with perspective over 0.6s, showing its back side with the reveal text.',
 'بطاقة تلف 180 درجة على المحور العمودي مع عمق خلال 0.6 ثانية، وتبين ظهرها وفيه الجواب.',function(){return '<div class="p3"><div class="fcard a" style="--k:k252"><div class="fr">سؤال؟</div><div class="bk2">الجواب</div></div></div>';},'3s']),
N(['M-253','D3','Cube Spin','مكعب يلف','مكعب ثلاثي الأبعاد يلف، لشعار أو منتج.','A spinning 3D cube for a logo or product.','loop · 4s','linear',
 'Build a cube from six faces with preserve-3d, tilt it -20° on X and rotate it a full turn on Y every 4s; put the logo on the faces.',
 'ابنِ مكعب من ستة أوجه بـ preserve-3d، ميّله -20 درجة على X ولفّه لفة كاملة على Y كل 4 ثواني، وحط الشعار على الأوجه.',function(){var f=['rotateY(0deg)','rotateY(90deg)','rotateY(180deg)','rotateY(-90deg)','rotateX(90deg)','rotateX(-90deg)'];return '<div class="p3"><div class="cube a" style="--k:k253;--ez:linear">'+f.map(function(t){return '<i style="transform:'+t+' translateZ(17cqw)">'+STAR+'</i>';}).join('')+'</div></div>';},'4s']),
N(['M-254','D3','Tilt Card','بطاقة تميل','بطاقة تميل وكأنك ماسكها بيدك.','A card tilting as if held in your hand.','loop · 4s','easeInOutSine',
 'Tilt a card on X and Y (±12–16°) with perspective on a smooth 4s loop, with a soft shadow beneath it.',
 'ميّل البطاقة على X و Y (±12 إلى 16 درجة) مع عمق كل 4 ثواني بنعومة، وتحتها ظل ناعم.',function(){return '<div class="tcard2 a" style="--k:k254"><span class="dim2">ALANSARI.TECH</span><b>بطاقتك</b></div>';},'4s']),
N(['M-255','D3','Layer Explode','طبقات تنفصل','طبقات التصميم تنفصل عن بعض بشكل 3D.','Design layers separate apart in 3D.','0.8s','easeInOutCubic',
 'Tilt a stack of layers into an isometric view and push each layer apart on Z (0, 8%, 16%…), then bring them back together.',
 'ميّل كومة الطبقات لزاوية جانبية، وبعّد كل طبقة عن الثانية على Z (0، 8%، 16%…)، وبعدين رجّعهم مع بعض.',function(){var c=['rgba(15,91,102,.85)','rgba(127,224,200,.55)','rgba(240,122,80,.8)'];return '<div class="p3"><div class="lay a" style="--k:k255r">'+c.map(function(x,i){return '<i class="a" style="--k:k255z;--z:'+(i*9)+'cqw;background:'+x+'"></i>';}).join('')+'</div></div>';},'3s']),
N(['M-256','D3','3D Carousel','عجلة بطاقات','بطاقات تدور بشكل دائري، لعرض عدة أشياء.','Cards rotating on a 3D ring to show several items.','loop · 6s','linear',
 'Place 5–8 cards evenly around a 3D ring (rotateY steps + translateZ) and rotate the ring slowly.',
 'حط من 5 إلى 8 بطاقات متساوية حول حلقة 3D (rotateY ثم translateZ)، ولف الحلقة ببطء.',function(){var c=['#E3643F','#0F5B66','#FFC857','#7FE0C8','#E3643F','#0F5B66'];return '<div class="p3"><div class="car a" style="--k:k256;--ez:linear">'+c.map(function(x,i){return '<i style="background:'+x+';transform:rotateY('+(i*60)+'deg) translateZ(34cqw)">'+(i+1)+'</i>';}).join('')+'</div></div>';},'6s']),
N(['M-257','D3','Float Shadow','عنصر يطفو مع ظل','منتج أو شعار يطفو وظله يتغير تحته.','A product or logo floats with a shadow that changes below it.','loop · 3s','easeInOutSine',
 'Bob the object up 6% with a slight rotation while its drop shadow grows softer and lighter at the top of the motion.',
 'خل العنصر يطلع لفوق 6% مع دوران خفيف، وظله تحته يصير أنعم وأخف لمن يكون فوق.',function(){return '<div class="a" style="--k:k257;border-radius:6cqw;background:#17393f;padding:6cqw"><div class="logo" style="width:24cqw;height:24cqw">'+STAR+'</div></div>';},'3s']),
N(['M-258','D3','Coin Flip','عملة تنقلب','عملة تطير وتنقلب، مثل "صح ولا خطأ".','A coin tosses and flips, like heads or tails.','1.2s','easeInOutQuad',
 'A two-sided coin rises and falls while spinning several times around the Y axis over about 1.2s, landing on one face.',
 'عملة بوجهين تطلع وتنزل وهي تلف كم لفة على المحور العمودي خلال تقريباً 1.2 ثانية، وتوقف على وجه.',function(){return '<div class="p3"><div class="coin a" style="--k:k258;--ez:ease-in-out"><div>A</div><div class="b3">T</div></div></div>';}]),

N(['M-259','TIM','Reverse','عكس الفيديو','الفيديو يرجع لورا، للمفاجأة أو الضحك.','The clip plays backwards for surprise or fun.','clip length','linear',
 'Play the selected segment backwards (frames in reverse order) and show a small "◀◀" tag in the corner.',
 'شغّل الجزء المختار بالعكس (الفريمات من آخرها لأولها)، وطلّع تاق صغير "◀◀" بالزاوية.',function(){return '<div class="L a" style="--k:k259;--ez:linear;animation-direction:alternate">'+BG()+P()+'</div><span class="ttag">◀◀</span>';},'2s']),
N(['M-260','TIM','Boomerang','بومرنغ','لقطة قصيرة تروح وترجع بتكرار.','A short clip plays forward and back in a loop.','loop · 1s','linear',
 'Take a 0.5–1s segment and play it forward then backward repeatedly, like a boomerang.',
 'خذ جزء من 0.5 إلى ثانية وشغّله قدام وبعدين ورا بتكرار، مثل البومرنغ.',function(){return '<div class="L a" style="--k:k260;--ez:ease-in-out">'+BG()+P()+'</div>';},'1s']),
N(['M-261','TIM','Stop Motion','ستوب موشن','حركة متقطعة مثل الرسوم المصورة.','Choppy, frame-by-frame motion like stop motion.','12fps','steps',
 'Drop the frame rate to about 8–12fps by holding each frame for 3–4 frames, giving a choppy stop-motion feel.',
 'نزّل عدد الفريمات لتقريباً 8 إلى 12 بالثانية بتثبيت كل فريم 3 إلى 4 فريمات، فتطلع الحركة متقطعة مثل الستوب موشن.',function(){return '<div class="L a" style="--k:k261;--ez:steps(6);animation-direction:alternate">'+BG()+P()+'</div><span class="ttag">12 FPS</span>';},'2s']),
N(['M-262','TIM','Strobe','ستروب','نسخ ثابتة من الحركة تبقى ورا بعض.','Frozen copies of a move stay behind it.','0.8s','steps',
 'Every 4 frames, freeze a copy of the person at about 35% opacity so the motion leaves a trail of still poses.',
 'كل 4 فريمات، ثبّت نسخة من الشخص بشفافية تقريباً 35%، فالحركة تخلي وراها وقفات ثابتة.',function(){return BG()+[0,1,2,3].map(function(i){return '<div class="L a" style="--k:k262;--i:'+i+';--sg:.25s;--ez:steps(1)"><i class="pp sm" style="left:'+(20+i*20)+'%"></i></div>';}).join('');},'2s']),
N(['M-263','TIM','Time-Lapse Clock','ساعة تسرّع','ساعة عقاربها تلف بسرعة، مثل "بعد ساعات".','Clock hands spin fast, like "hours later".','1.5s','linear',
 'A clock face with the minute hand spinning many turns and the hour hand moving slowly, for 1–2s, with a "+3h" style label.',
 'ساعة عقرب الدقايق فيها يلف لفات كثيرة وعقرب الساعات يمشي ببطء، لمدة ثانية إلى ثانيتين، مع تاق مثل "+3h".',function(){return '<div class="clock"><i class="hh a" style="--k:rot;--ez:linear;--d:12s"></i><i class="mm a" style="--k:rot;--ez:linear;--d:1s"></i></div><span class="ttag">+3h</span>';},'2s']),
N(['M-264','TIM','Day to Night','من النهار لليل','الإضاءة تتغير كأن الوقت يمشي.','The lighting shifts as if time passes.','2s','easeInOutSine',
 'Grade the shot from warm daylight to a cool, darker night look over about 2s (color temperature, exposure and saturation).',
 'غيّر ألوان اللقطة من نهار دافي لليل بارد وأغمق خلال تقريباً ثانيتين (حرارة اللون، والإضاءة، والتشبع).',function(){return '<div class="scene a" style="--k:k263s;--ez:ease-in-out"></div>'+P();},'4s']),
N(['M-265','TIM','Fast Forward','تقديم سريع','الفيديو يسرع مع تاق ▶▶.','The clip speeds up with a ▶▶ tag.','clip length','linear',
 'Play the segment at 2–4× speed with a "▶▶ 4×" tag and a light motion blur.',
 'شغّل الجزء بسرعة 2 إلى 4 مرات مع تاق "▶▶ 4×" وضبابية حركة خفيفة.',function(){return '<div class="L a" style="--k:k122;--ez:linear;--d:.7s">'+BG()+P()+'</div><span class="ttag">▶▶ 4×</span>';},'1.4s']),
N(['M-266','TIM','Rewind Glitch','ترجيع مع تشويش','ترجيع سريع مع خطوط تشويش، مثل الشريط.','A fast rewind with tape-like noise lines.','0.6s','steps',
 'Play the last second backwards at 3× with VHS noise lines (M-155) and a "◀◀ REW" tag, then cut back to normal.',
 'شغّل آخر ثانية بالعكس بسرعة 3 مرات مع خطوط تشويش (M-155) وتاق "◀◀ REW"، وبعدين ارجع طبيعي.',function(){return A('k155',BG()+P(),'cam',null,null,'steps(1)')+'<i class="vhsb a" style="--k:k155b;--ez:linear"></i><span class="ttag">◀◀ REW</span>';},'1.6s']),

N(['M-267','TRN','Shape Morph','شكل يتحول','شكل يتحول لشكل ثاني بنعومة.','A shape morphs smoothly into another.','0.6s','easeInOutCubic',
 'Interpolate between shapes (circle → rounded square → leaf) by animating corner radii and rotation, or by morphing matching SVG paths.',
 'انتقل بين الأشكال (دائرة ثم مربع دائري ثم ورقة) بتحريك الزوايا والدوران، أو بتحويل مسارات SVG متطابقة.',function(){return '<div class="mrph a" style="--k:k267"></div>';},'3s']),
N(['M-268','TRN','Liquid Reveal','انكشاف سائل','بقعة سائلة تكبر وتغطي المشهد للانتقال.','A liquid blob grows to cover the cut.','0.7s','easeInOutCubic',
 'An organic blob shape in the accent color grows from the center while its border radius wobbles, covers the frame, then fades to reveal the new clip.',
 'بقعة بشكل طبيعي بلون الهوية تكبر من النص وحوافها تتموج، تغطي الشاشة، وبعدين تختفي وتكشف المقطع الجديد.',function(){return AB({},{k:'lsb',ez:'steps(1)'})+'<i class="blob a" style="--k:k268b;--ez:ease-in-out"></i>';}]),
N(['M-269','TRN','Ink Splash Reveal','انكشاف بقعة حبر','المشهد الجديد يطلع من بقع حبر تكبر.','The new shot appears through growing ink splashes.','0.7s','easeOutCubic',
 'Reveal the new clip through a mask of several overlapping circles (ink splash shape) that scales up from the center to cover the frame.',
 'اكشف المقطع الجديد من قناع فيه كم دائرة متداخلة (شكل بقعة حبر) يكبر من النص لين يغطي الشاشة.',function(){return AB({},{k:'k269',c:'ink',ez:'ease-out'});}]),
N(['M-270','TRN','Film Burn','حرق فيلم','ضوء حارق مثل الأفلام القديمة يغطي القص.','A hot film-burn flare hides the cut.','0.8s','easeInOutSine',

'M-005':{ue:'Calm lines or the opening of a video.',sa:'النص يبدأ بحجم 130% وضبابية 30px وشفافية 0، ويستقر على 100% واضح خلال 0.7 ثانية. وبالخروج يتضبب لـ 20px ويختفي خلال 0.5 ثانية.'},
'M-006':{ue:'Highlights a key word like a marker pen.',sa:'مربع بلون الهوية يكبر ورا الكلمة من 0% لـ 100% من عرضها خلال 0.5 ثانية، من جهة بداية القراءة (اليمين بالعربي). لون الكلمة يصير غامق عشان يبين. وبالخروج المربع يصغر ويرجع.'},

'M-008':{ue:'A strong word that needs a hit on the beat or a sound effect.',sa:'بنفس فريم نطق الكلمة، تكبر لـ 150% خلال 0.15 ثانية ويصير لونها لون الهوية، وبعدين تستقر على 125% خلال 0.25 ثانية وتثبت. ترجع 100% بالنهاية. حط معها صوت "بوم" أو "بوب" قصير.'},
'M-009':{ue:'Surprise, anger or a warning.',sa:'الكلمة تهتز يمين ويسار بإزاحة ±6% ودوران ±4 درجات، تتبدل كل 0.04 إلى 0.05 ثانية لمدة تقريباً 0.6 ثانية، والهزة تخف تدريجياً لين توقف.'},
'M-010':{ue:'Tech, AI and hacking topics.',sa:'لمدة تقريباً 0.6 ثانية، نسختين من النص (سماوي #3FE0FF وأحمر #FF3F6C) ترجف بإزاحة ±5% وتطلع من شرائح أفقية عشوائية تتغير كل 2 إلى 3 فريمات، والنص الأساسي يميل ±8 درجات. بعدها كل شي يرجع نظيف مرة وحدة.'},
'M-011':{ue:'The main Reels caption: each word lights up as it is spoken.',sa:'سطر الكابشن كامل يطلع بأبيض باهت (شفافية 50%). كل كلمة تتلون بلون الهوية بالضبط وقت نطقها (من توقيتات التفريغ كلمة كلمة) وتبقى ملونة. خط عريض تقريباً 64px على عرض 1080، بالنص وداخل المنطقة الآمنة (y من 1350 لين 1550).'},
'M-012':{ue:'A fast, lively caption, word by word.',sa:'كل كلمة تطلع وقت نطقها، تكبر من 30% لـ 118% وتستقر على 100% خلال 0.18 ثانية. الكلمات اللي قبلها تبقى. امسح السطر لمن تخلص الجملة.'},
'M-013':{ue:'A whole line drops in at once with a playful move.',sa:'سطر الكابشن كامل يدخل من تحت بـ 130% بحركة نابض: يتعدى لـ -14%، يرتد لـ +6%، ويستقر على 0 خلال تقريباً 0.55 ثانية. ويختفي بتلاشي.'},
'M-014':{ue:'TikTok-style caption where the box follows your voice.',sa:'مربع بلون الهوية بزوايا دائرية يكون ورا الكلمة اللي تنقال الحين بس، والكلمة تصير غامقة. لمن تبدأ الكلمة اللي بعدها، المربع ينط لها مع تكبير خفيف 6%. باقي الكلمات تبقى بيضا.'},
'M-015':{ue:'Fast, punchy talk: one big word in the middle.',sa:'كلمة وحدة بس على الشاشة، كبيرة (تقريباً 110px) وبالنص. كل كلمة جديدة تحل محل اللي قبلها بتكبير سريع من 60% لـ 110% لـ 100% خلال 0.15 ثانية. وتقدر تلوّن الكلمات المهمة بلون الهوية.'},
'M-016':{ue:'Swap the background or scene from a point, like your finger or face.',sa:'المشهد الجديد ينكشف من دائرة تكبر من نقطة تختارها (مثل طرف الإصبع) من نصف قطر 0 لين تغطي الشاشة كاملة خلال 0.6 ثانية، وحافتها ناعمة 30px. وحلقة رفيعة بلون الهوية تكبر قدام الحافة شوي وتختفي.'},
'M-017':{ue:'A clear transition between two clips or places.',sa:'المشهد الجديد يمسح الشاشة ورا حافة عمودية تتحرك خلال 0.5 ثانية. الحافة خط أبيض 4px مع توهج بلون الهوية.'},
'M-018':{ue:'A magic change, like "look how it changed".',sa:'شعاع ضوء دافي مايل (عرضه تقريباً 15% من الشاشة وزاويته 105 درجات) يمسح الشاشة خلال 0.7 ثانية، والمشهد يتبدل للجديد بالضبط لمن يعدي الشعاع نص الشاشة.'},
'M-019':{ue:'A fast, punchy cut between two clips.',sa:'المقطع الطالع يكبر لـ 170% مع ضبابية تقريباً 10px ويختفي خلال 0.4 ثانية (easeInExpo). والمقطع الداخل يبدأ من 160% مضبب ويستقر على 100% واضح خلال 0.4 ثانية (easeOutExpo).'},
'M-020':{ue:'Cut between two shots as if the camera spun.',sa:'المقطع الطالع ينسحب لجهة مع ضبابية حركة أفقية قوية، والداخل يدخل من الجهة الثانية، والمجموع 0.35 ثانية. حط معاه صوت "ووش" سريع.'},
'M-021':{ue:'Hides cuts between lines, or stresses a line.',sa:'الصورة تنط مرة وحدة من 100% لـ 125% وبالنص على الوجه، عند القص أو كلمة مهمة. تثبت، وبعدين ترجع 100% عند القص اللي بعده. بدون easing.'},
'M-022':{ue:'A serious moment or a story.',sa:'الصورة تكبر بنعومة من 100% لـ تقريباً 116% على طول اللقطة كاملة، والمركز فوق الوجه بشوي.'},
'M-023':{ue:'With a hit, an explosion or a strong word.',sa:'كبّر الصورة لـ 108% عشان الأطراف ما تبين، وبعدين حرّكها بإزاحات عشوائية ±1.5% ودوران ±0.8 درجة تتغير كل 2 إلى 3 فريمات. وخل الهزة تخف بالنهاية.'},
'M-024':{ue:'Like "zoom out", or to show something next to the video.',sa:'الفيديو كامل يصغر لـ 60% ويميل -3 درجات، وزواياه دائرية تقريباً 48px، مع ظل غامق فوق خلفية مزخرفة غامقة (0.6 ثانية). يثبت، وبعدين يرجع يملأ الشاشة مع تعدي خفيف لـ 104% (0.5 ثانية).'},
'M-025':{ue:'Bring a still photo to life.',sa:'صورة ثابتة تكبر ببطء من 112% لـ 132% وهي تتحرك قطرياً تقريباً 10% من الشاشة على طول المدة.'},
'M-026':{ue:'A logo or object breaks apart and vanishes, like a finger snap.',sa:'العنصر يتفتت لـ 150 إلى 400 جزيء صغير مأخوذة من ألوانه نفسها. كل جزيء يطير لبرا باتجاه عشوائي (60 إلى 250px) مع ميل خفيف لفوق، ويصغر ويختفي خلال 1.2 ثانية. العنصر الأصلي يختفي أول 0.1 ثانية.'},

'M-028':{ue:'Behind your head when you talk about something important.',sa:'حلقات بلون الهوية تطلع ورا الشخص (على طبقة الخلفية تحت قناع الشخص) كل ثلث دورة، تكبر من 50% لـ 300% وتختفي.'},
'M-029':{ue:'A "wow" moment or a new announcement.',sa:'أشعة ناعمة بلون الهوية (conic gradient، شعاع 6 درجات كل 22 درجة) تدور ببطء ورا الشخص، وقناع دائري يخفيها تدريجياً عند تقريباً 45% من نصف القطر. حطها على الطبقة اللي ورا قناع الشخص.'},
'M-030':{ue:'A celebration, an achievement or a big number.',sa:'40 إلى 80 قصاصة مستطيلة صغيرة بـ 4 ألوان من الهوية تنفجر من نقطة بسرعات عشوائية (أغلبها لفوق، ±60 درجة)، تدور عشوائياً، وبعدين تطيح بالجاذبية وتختفي خلال 1.5 ثانية.'},
'M-031':{ue:'When you say "follow me".',sa:'مؤشر ضغطة (دائرة بيضا بهالة ناعمة) يجي على زر متابعة، يضغطه (الزر يصغر لـ 88%)، والزر يتحول من "متابعة" بلون الهوية لـ "تتابعه ✓" رمادي. حط معاه صوت كليك خفيف.'},
'M-032':{ue:'When you say "write it in the comments".',sa:'خانة تعليق بستايل إنستغرام فيها نص "أضف تعليقاً…"، وبعدين الكلمة تنكتب حرف حرف (من اليمين لليسار بالعربي) وزر الإرسال الأزرق ينبض (75% ثم 115% ثم 100%). وبعدها تقدر تحط M-035 أو M-034.'},
'M-033':{ue:'Asking for a like, or a sweet moment.',sa:'قلب أحمر ينط من 0 لـ 135% ويستقر على 100% (0.35 ثانية). وبنفس الوقت 8 نقاط صغيرة تنطلق لبرا بشكل دائري بمسافة 27% من الشاشة وتختفي. وتقدر تطلّع "+1" يطير لفوق.'},
'M-034':{ue:'"The prompt will reach you in DMs".',sa:'إشعار بستايل الجوال (أيقونة التطبيق، عنوان عريض، وسطر معاينة) ينزل من فوق الشاشة بحركة نابض (يتعدى تقريباً 10%)، يثبت تقريباً ثانيتين، وبعدين يرجع لفوق. حط معاه صوت إشعار ناعم.'},
'M-035':{ue:'Sending a message or a comment.',sa:'أيقونة طيارة ورق تطير على مسار منحني من تحت يسار لفوق يمين، تلف مع اتجاه المسار وتصغر بالنهاية، وتخلي وراها خط متقطع ينرسم.'},
'M-036':{ue:'A logo floating gently behind you.',sa:'الشعار يطفو ورا الشخص (طبقة الخلفية تحت قناع الشخص) بحركة خفيفة لفوق وتحت ±9% كل 3 ثواني (sine) مع توهج ناعم.'},
'M-037':{ue:'Opening or closing a video.',sa:'الشعار يدخل وهو يدور من -220 درجة وحجم 0 لين 0 درجة و112%، وبعدين يستقر على 100%، والمجموع 0.7 ثانية. وبالخروج يصغر لـ 0 مع لفة 90 درجة.'},
'M-038':{ue:'The tool or topic name, like a "Claude Opus 5.5" card.',sa:'بطاقة غامقة بزوايا دائرية وإطار بلون الهوية، فيها أيقونة على جنب وعنوان بسطرين (عنوان عريض mono وتحته عنوان فرعي بلون الهوية)، تنزل من فوق الشاشة بحركة نابض وتتعدى تقريباً 10%. تثبت، وبعدين ترجع لفوق.'},
'M-039':{ue:'Introduce your name or handle.',sa:'شريط بلون الهوية يطلع من الحافة اليمين (0.4 ثانية)، وبعدين الاسم والسطر اللي تحته يدخلون بإزاحة 12% ويظهرون داخل الشريط (0.3 ثانية، وبينهم 0.08 ثانية). يثبت، وبعدين النص يختفي والشريط ينسحب.'},
'M-040':{ue:'A stat or big number counting up.',sa:'رقم يعد من 0 لين الرقم المطلوب خلال 1.2 ثانية (easeOutExpo: سريع بالبداية وبعدين يبطّي)، بأرقام mono متساوية العرض وبلون الهوية، وتحته وصف. وتقدر تحط على الرقم الأخير ضربة تكبير (M-008).'}
